name: Production health

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

env:
  NODE_VERSION: '24.13.0'
  NPM_VERSION: '11.12.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://formular-web.vercel.app' }}
      EXPECTED_RELEASE_VERSION: ${{ vars.EXPECTED_RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify public production responses without credentials or writes
        run: node scripts/verify-production.mjs
      - name: Preserve health evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-health
          path: artifacts/production
          if-no-files-found: error
          retention-days: 14
