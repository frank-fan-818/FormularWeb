name: Refresh post-race FastF1 analytics

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh; defaults to the current UTC year
        required: false
        type: string
      round:
        description: Optional round to repair
        required: false
        type: string
      primary_runner:
        description: Hosted runner for the first attempt (also used to exercise recovery)
        required: false
        type: choice
        options:
          - macos-15
          - ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: refresh-fastf1-analytics
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24.13.0'
  NPM_VERSION: '11.12.0'
  PYTHON_VERSION: '3.12'

jobs:
  refresh:
    name: Export, verify, and publish to Supabase
    # F1's timing source rejects GitHub's Ubuntu egress with HTTP 403.
    # Use a hosted runner independent of the user's offline local collector.
    runs-on: ${{ inputs.primary_runner || vars.FASTF1_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    continue-on-error: true
    outputs:
      season: ${{ steps.scope.outputs.season }}
      passed: ${{ steps.result.outputs.passed }}
    steps: &refresh-steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-fastf1.txt

      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION

      - name: Install Node.js dependencies
        run: npm ci --include=dev

      - name: Install pinned FastF1 exporter
        run: python -m pip install --requirement requirements-fastf1.txt

      - name: Validate publish credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi

      - name: Resolve refresh scope
        id: scope
        shell: bash
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
          REQUESTED_ROUND: ${{ inputs.round }}
        run: |
          season="$REQUESTED_SEASON"
          if [ -z "$season" ]; then season="$(date -u +%Y)"; fi
          if ! [[ "$season" =~ ^[0-9]{4}$ ]] || [ "$season" -lt 1950 ] || [ "$season" -gt 2100 ]; then
            echo "::error::Season must be a four-digit year between 1950 and 2100."
            exit 1
          fi
          if [ -n "$REQUESTED_ROUND" ] && { ! [[ "$REQUESTED_ROUND" =~ ^[0-9]+$ ]] || [ "$REQUESTED_ROUND" -lt 1 ]; }; then
            echo "::error::Round must be a positive integer."
            exit 1
          fi
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "round=$REQUESTED_ROUND" >> "$GITHUB_OUTPUT"
          echo "FASTF1_ROOT=$RUNNER_TEMP/fastf1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Test automation policies
        run: |
          npm run fastf1:automation-test
          python -m unittest scripts.fastf1_classification_test

      - name: Restore complete private snapshots
        id: restore
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
        run: |
          args=(--season "$SEASON" --input "$FASTF1_ROOT")
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          node scripts/restore-private-fastf1.mjs "${args[@]}"

      - name: Export completed analysis sessions
        id: export
        continue-on-error: true
        shell: bash
        env:
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
        run: |
          args=(--season "$SEASON" --output "$FASTF1_ROOT" --cache "$FASTF1_ROOT/cache" --completed-only --refresh-incomplete --availability-delay-hours 4 --session-timeout-seconds 900 --max-runtime-seconds 2400)
          if [ -n "$ROUND" ]; then args+=(--from-round "$ROUND" --to-round "$ROUND"); fi
          python scripts/export-fastf1-season-data.py "${args[@]}"

      - name: Import every complete snapshot into Supabase
        id: database
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
        run: |
          args=(--season "$SEASON" --input "$FASTF1_ROOT" --complete-only --session R --session Q --session S --session SQ --session SS --session FP1 --session FP2 --session FP3)
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          npm run fastf1:import-sessions -- "${args[@]}"

      - name: Publish each complete session to private Storage
        id: storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
        run: |
          args=(--season "$SEASON" --input "$FASTF1_ROOT")
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          node scripts/upload-private-fastf1.mjs "${args[@]}"

      - name: Verify all eligible analysis sessions are complete
        id: verify
        continue-on-error: true
        env:
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
        run: |
          args=(--season "$SEASON" --input "$FASTF1_ROOT")
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          npm run fastf1:verify-manifest -- "${args[@]}"

      - name: Report persistent session health
        id: health
        if: ${{ !cancelled() && steps.export.outcome != 'skipped' && steps.scope.outputs.season != '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ steps.scope.outputs.season }}
          ROUND: ${{ steps.scope.outputs.round }}
          FASTF1_PIPELINE_FAILED: ${{ steps.restore.outcome == 'failure' || steps.export.outcome == 'failure' || steps.database.outcome == 'failure' || steps.storage.outcome == 'failure' || steps.verify.outcome == 'failure' }}
          FASTF1_RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FASTF1_EXPORT_OUTCOME: ${{ steps.export.outcome }}
          FASTF1_DATABASE_OUTCOME: ${{ steps.database.outcome }}
          FASTF1_STORAGE_OUTCOME: ${{ steps.storage.outcome }}
          FASTF1_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          args=(--season "$SEASON" --input "$FASTF1_ROOT")
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          node scripts/report-fastf1-health.mjs "${args[@]}"

      - name: Upload sanitized diagnostics
        if: ${{ !cancelled() && steps.scope.outputs.season != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fastf1-diagnostics-${{ steps.scope.outputs.season }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ env.FASTF1_ROOT }}/${{ steps.scope.outputs.season }}/export-report.json
            ${{ env.FASTF1_ROOT }}/${{ steps.scope.outputs.season }}/manifest.json
            ${{ env.FASTF1_ROOT }}/${{ steps.scope.outputs.season }}/publication-report.json
            ${{ env.FASTF1_ROOT }}/${{ steps.scope.outputs.season }}/database-report.json
            ${{ env.FASTF1_ROOT }}/${{ steps.scope.outputs.season }}/health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reject unresolved pipeline failures
        if: ${{ !cancelled() && (steps.restore.outcome == 'failure' || steps.export.outcome == 'failure' || steps.database.outcome == 'failure' || steps.storage.outcome == 'failure' || steps.health.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        run: |
          echo "::error::FastF1 has unresolved fetch, publication or completeness failures. See the health summary and diagnostic artifact."
          exit 1

      - name: Record verified attempt outcome
        id: result
        if: ${{ always() }}
        env:
          PASSED: ${{ job.status == 'success' && steps.restore.outcome == 'success' && steps.export.outcome == 'success' && steps.database.outcome == 'success' && steps.storage.outcome == 'success' && steps.verify.outcome == 'success' && steps.health.outcome == 'success' }}
        run: echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

  recovery:
    name: Recover on an independent hosted runner
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.passed != 'true' }}
    runs-on: ${{ (inputs.primary_runner || vars.FASTF1_RUNNER || 'macos-15') == 'macos-15' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 90
    continue-on-error: true
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    # Repeat exactly the same validation/publication contract, with a fresh
    # cache and restored complete snapshots. Never retry concurrently.
    steps: *refresh-steps

  result:
    name: Require a verified FastF1 refresh
    needs: [refresh, recovery]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce final result
        env:
          PRIMARY_PASSED: ${{ needs.refresh.outputs.passed }}
          RECOVERY_PASSED: ${{ needs.recovery.outputs.passed }}
        run: |
          if [ "$PRIMARY_PASSED" != "true" ] && [ "$RECOVERY_PASSED" != "true" ]; then
            echo "::error::Neither runner completed a verified refresh. Inspect both diagnostic artifacts; missing data has not been accepted."
            exit 1
          fi
          if [ "$PRIMARY_PASSED" == "true" ]; then
            echo "FastF1 refresh passed on the primary runner." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FastF1 refresh recovered on the alternate runner; all publication and completeness checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi
