name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.13.0'
  NPM_VERSION: '11.12.0'

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.11'
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - run: npm ci --include=dev
      - name: Install pinned Semgrep OSS
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --index-url https://pypi.org/simple
          --requirement scripts/semgrep-requirements.lock
      - name: Run source data-flow analysis
        run: npm run sast:check
      - name: Verify GitHub workflow safety and compatibility
        run: npm run workflows:verify
      - name: Verify production deployment routing
        run: npm run deployment:verify
      - name: Scan tracked files and database policies
        run: npm run security:check
      - name: Block high-severity dependency vulnerabilities
        run: npm run security:audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - run: npm ci --include=dev
      - run: npm run encoding:check
      - run: npm run lint:strict

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - run: npm ci --include=dev
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - run: npm ci --include=dev
      - run: npm run toolchain:verify
      - run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [security, lint, type-check, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Verify Lighthouse assertions
        run: npm run lighthouse:config:verify
      - name: Build production bundle
        run: npm run build
      - name: Verify built service worker upgrade invariants
        run: npm run service-worker:verify
      - name: Check performance budget
        run: npm run budget:performance
      - name: Run Lighthouse CI
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist

  browser-qa:
    name: Browser QA
    runs-on: ubuntu-latest
    needs: [security, lint, type-check, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@$NPM_VERSION
      - run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run desktop and mobile route smoke tests
        run: npm run test:e2e:built
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-qa
          path: artifacts/browser-qa
          if-no-files-found: error
          retention-days: 14
