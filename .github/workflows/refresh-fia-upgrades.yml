name: Refresh pre-race FIA upgrades

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh; defaults to the current UTC year
        required: false
        type: string
      round:
        description: Optional round to backfill outside the race-week window
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-fia-upgrades
  cancel-in-progress: false

env:
  NODE_VERSION: '24.13.0'
  NPM_VERSION: '11.12.0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore recent calendar
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/race-calendar
          key: calendar-v1-fia-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calendar-v1-fia-

      - name: Check race-window eligibility
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          REQUESTED_ROUND: ${{ inputs.round }}
        run: node scripts/race-window.mjs fia

      - name: Save validated live calendar
        if: steps.window.outputs.source == 'live'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/race-calendar
          key: calendar-v1-fia-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Use pinned npm
        if: steps.window.outputs.eligible == 'true'
        run: npm install --global npm@$NPM_VERSION

      - name: Install toolchain
        if: steps.window.outputs.eligible == 'true'
        run: npm ci --include=dev

      - name: Verify parsing and publication policies
        if: steps.window.outputs.eligible == 'true'
        run: npx vitest run src/utils/fiaCarUpgrades.test.ts src/utils/fiaUpgradeAutomation.test.ts src/api/fiaUpgradePublisher.test.ts

      - name: Discover, validate and publish FIA declarations
        if: steps.window.outputs.eligible == 'true'
        env:
          REQUESTED_SEASON: ${{ steps.window.outputs.season }}
          REQUESTED_ROUND: ${{ inputs.round }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          args=()
          if [ -n "$REQUESTED_SEASON" ]; then args+=(--season "$REQUESTED_SEASON"); fi
          if [ -n "$REQUESTED_ROUND" ]; then args+=(--round "$REQUESTED_ROUND"); fi
          npm run fia:refresh -- "${args[@]}"

      - name: Retain parsed publication evidence
        if: always() && steps.window.outputs.eligible == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fia-upgrade-publications
          path: artifacts/fia-refresh/
          if-no-files-found: ignore
          retention-days: 7
