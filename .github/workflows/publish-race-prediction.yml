name: Publish race winner prediction

on:
  schedule:
    # Every day covers Thursday/Friday qualifying and Saturday races too.
    # Heavy work remains limited to the 72-hour pre-race window below.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to publish; defaults to the current UTC year
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-race-winner-prediction
  cancel-in-progress: false

env:
  NODE_VERSION: '24.13.0'
  NPM_VERSION: '11.12.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore recent calendar
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/race-calendar
          key: calendar-v1-prediction-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calendar-v1-prediction-

      - name: Check race-window eligibility
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          REQUESTED_ROUND: ${{ inputs.round }}
        run: node scripts/race-window.mjs prediction

      - name: Save validated live calendar
        if: steps.window.outputs.source == 'live'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/race-calendar
          key: calendar-v1-prediction-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Use pinned npm
        if: steps.window.outputs.eligible == 'true'
        run: npm install --global npm@$NPM_VERSION

      - name: Install toolchain
        if: steps.window.outputs.eligible == 'true'
        run: npm ci --include=dev

      - name: Publish latest eligible prediction
        if: steps.window.outputs.eligible == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if npm run prediction:publish -- --season "${{ steps.window.outputs.season }}"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
